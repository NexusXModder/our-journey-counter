<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Sync Visualizer & Holographic Memory</title>

    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', sans-serif; 
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
        }
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            overflow-x: hidden; 
            padding: 20px; 
            -webkit-touch-callout: none;
        }
        
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 25px; align-items: center; }
        
        /* Visualizer Box */
        .visualizer-card { background: #161b22; border: 1px solid #30363d; border-radius: 1.5rem; padding: 25px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
        .visualizer-card h3 { color: #f43f5e; margin-bottom: 5px; font-size: 1.1rem; letter-spacing: 1px; font-weight: 800; }
        .status { font-size: 0.8rem; color: #8b949e; margin-bottom: 15px; }
        
        canvas { width: 100%; height: 90px; background: #0d1117; border-radius: 0.75rem; display: block; border: 1px solid #30363d; }

        /* Biological Vital Stats Row */
        .vital-row { display: flex; gap: 15px; width: 100%; }
        .vital-box { flex: 1; background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 1rem; text-align: center; }
        .vital-box .val { font-size: 1.1rem; font-weight: bold; color: #5ccfe6; }
        .vital-box .lbl { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; margin-top: 2px; }

        /* 3D Holographic Card */
        .holo-card-container { perspective: 1000px; width: 100%; display: flex; justify-content: center; }
        .holo-card { 
            width: 100%; 
            height: 210px; 
            background: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 1.5rem; 
            padding: 30px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            cursor: pointer; 
            transition: transform 0.1s ease-out, box-shadow 0.3s ease; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
            position: relative; 
            overflow: hidden; 
            touch-action: none; 
        }
        
        .holo-card::after { 
            content: ''; 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle 160px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(244, 63, 94, 0.28), rgba(217, 119, 6, 0.12) 50%, transparent 80%); 
            opacity: var(--light-opacity, 0); 
            transition: opacity 0.2s ease; 
            pointer-events: none; 
            z-index: 1;
        }

        .holo-card h4 { font-size: 1.25rem; color: #fff; margin-bottom: 8px; font-weight: 700; z-index: 2; }
        .holo-card p { color: #8b949e; font-size: 0.9rem; line-height: 1.4; z-index: 2; }
        .holo-badge { position: absolute; top: 15px; right: 20px; font-size: 0.7rem; background: rgba(244,63,94,0.1); color: #f43f5e; padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(244,63,94,0.3); font-weight: 600; z-index: 2; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Frequency Visualizer -->
        <div class="visualizer-card">
            <h3>HEART SYNC FREQUENCY</h3>
            <div class="status">Status: Bio-Synced • Secure Channel</div>
            <canvas id="waveCanvas"></canvas>
        </div>

        <!-- Biological Vital Stats Box -->
        <div class="vital-row">
            <div class="vital-box">
                <div class="val" id="bpmVal">75 BPM</div>
                <div class="lbl">Heart Rate</div>
            </div>
            <div class="vital-box">
                <div class="val">99.9%</div>
                <div class="lbl">Resonance</div>
            </div>
            <div class="vital-box">
                <div class="val">100 Hz</div>
                <div class="lbl">Frequency</div>
            </div>
        </div>

        <!-- 3D Holographic Tilt Card -->
        <div class="holo-card-container">
            <div class="holo-card" id="tiltCard">
                <span class="holo-badge">Holographic Memory</span>
                <h4>Our Special Connection</h4>
                <p>Touch and drag or move your mouse over this card to experience the 3D holographic tilt and light effect!</p>
            </div>
        </div>
    </div>

    <script>
        // Disable Right Click & Inspect Shortcuts
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 's')) {
                e.preventDefault();
            }
        });

        // Wave Visualizer Script
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        
        function initCanvas() {
            canvas.width = canvas.parentElement.clientWidth - 50;
            canvas.height = 90;
        }
        window.addEventListener('resize', initCanvas);
        initCanvas();

        let step = 0;
        function drawWave() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#f43f5e';

            let sliceWidth = canvas.width / 100;
            let x = 0;

            for (let i = 0; i < 100; i++) {
                let v = Math.sin((i + step) * 0.1) * Math.cos((i - step) * 0.05);
                let y = (canvas.height / 2) + (v * (canvas.height / 3));

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
                x += sliceWidth;
            }
            ctx.stroke();
            step += 0.08;
            requestAnimationFrame(drawWave);
        }
        drawWave();

        setInterval(() => {
            const randomBpm = 72 + Math.floor(Math.random() * 6);
            document.getElementById('bpmVal').textContent = randomBpm + ' BPM';
        }, 3000);

        const card = document.getElementById('tiltCard');

        function handleMove(clientX, clientY) {
            const rect = card.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = ((y - centerY) / centerY) * -14;
            const rotateY = ((x - centerX) / centerX) * 14;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);
            card.style.setProperty('--light-opacity', `1`);
        }

        card.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
        card.addEventListener('mouseenter', () => card.style.setProperty('--light-opacity', `1`));
        card.addEventListener('touchmove', (e) => { if(e.touches.length > 0) handleMove(e.touches[0].clientX, e.touches[0].clientY); });
        card.addEventListener('touchstart', (e) => { if(e.touches.length > 0) handleMove(e.touches[0].clientX, e.touches[0].clientY); });
        card.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
            card.style.setProperty('--light-opacity', `0`);
        });
        card.addEventListener('touchend', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
            card.style.setProperty('--light-opacity', `0`);
        });
    </script>
</body>
</html>

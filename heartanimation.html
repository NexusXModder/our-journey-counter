<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heartbeat Animation</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .counter-card {
            background-color: #161b22;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            width: 500px;
            padding: 2rem;
            border-radius: 1.5rem;
            border: 1px solid #30363d;
            animation: fadeIn 1s ease-out;
            position: relative;
        }

        .menu-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            cursor: pointer;
            width: 22px;
            height: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .menu-btn span {
            display: block;
            height: 2.5px;
            width: 100%;
            background-color: #8b949e;
            border-radius: 2px;
            transition: 0.3s;
        }

        .menu-btn:hover span {
            background-color: #f43f5e;
        }

        .nav-drawer {
            height: 100%;
            width: 280px;
            position: fixed;
            z-index: 999;
            top: 0;
            left: -280px;
            background-color: #161b22;
            border-right: 1px solid #30363d;
            box-shadow: 5px 0 25px rgba(0, 0, 0, 0.7);
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            padding-top: 60px;
        }

        .nav-drawer.open {
            left: 0;
        }

        .nav-drawer .drawer-header {
            padding: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            border-bottom: 1px solid #30363d;
            margin-bottom: 10px;
        }

        .nav-drawer a {
            padding: 15px 20px;
            color: #c9d1d9;
            font-size: 1rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.2s, color 0.2s;
        }

        .nav-drawer a:hover {
            background-color: #21262d;
            color: #f43f5e;
        }

        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 998;
            display: none;
        }

        .backdrop.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pulse-heart {
            animation: pulse 1.2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
    </style>
</head>

<body>

    <div id="backdrop" class="backdrop" onclick="toggleMenu()"></div>

    <div id="navDrawer" class="nav-drawer">
        <div class="drawer-header">Navigation Tools</div>
        <a href="index.html">🏠 Home Dashboard</a>
        <a href="heartanimation.html">💓 Heartbeat Animation</a>
        <a href="memories.html">🔒 Secure Memories</a>
    </div>

    <div class="counter-card text-center">

        <div class="menu-btn" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="mb-6 pt-4">
            <svg
                class="w-20 h-20 text-pink-500 mx-auto pulse-heart"
                fill="currentColor"
                viewBox="0 0 20 20"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path
                    fill-rule="evenodd"
                    d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z"
                    clip-rule="evenodd"
                ></path>
            </svg>

            <h1 class="text-2xl sm:text-3xl font-extrabold text-white mt-4">
                Beating As One
            </h1>

            <p class="text-sm text-gray-400 mt-2">
                Every beat echoes our connection.
            </p>
        </div>

        <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-[#30363d]">
            <p class="text-gray-300 text-sm leading-relaxed">
                "In a world full of temporary things, you are my forever constant."
            </p>
        </div>

        <div class="mt-6">
            <a
                href="index.html"
                class="inline-block bg-pink-600 hover:bg-pink-500 text-white font-semibold text-sm px-6 py-3 rounded-xl transition duration-300 shadow-lg"
            >
                Back to Dashboard
            </a>
        </div>

    </div>

    <script>
        function toggleMenu() {
            const drawer = document.getElementById("navDrawer");
            const backdrop = document.getElementById("backdrop");
            drawer.classList.toggle("open");
            backdrop.classList.toggle("active");
        }
    </script>

</body>
</html>
